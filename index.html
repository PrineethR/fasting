<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="themeColorMeta" content="#111110">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FAST">
  <title>FAST</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app" id="app">

    <!-- ── Header ── -->
    <header class="header">
      <span class="brand">FAST</span>
      <div class="header-right">
        <button class="icon-btn" id="historyBtn" aria-label="History">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </button>
        <span class="streak-badge" id="streakBadge">— —</span>
      </div>
    </header>

    <!-- ── Progress Ring ── -->
    <section class="ring-section">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 300 300" aria-hidden="true">
          <!-- Tick marks around ring -->
          <g id="ringTicks" class="ring-ticks"></g>
          <!-- Background track -->
          <circle class="ring-track" cx="150" cy="150" r="118"/>
          <!-- Progress fill -->
          <circle class="ring-fill" id="ringFill" cx="150" cy="150" r="118"/>
          <!-- Traveling dot -->
          <circle class="ring-dot" id="ringDot" cx="150" cy="32" r="7"/>
        </svg>
        <div class="ring-inner">
          <div class="ring-time" id="ringTime">—:——:——</div>
          <div class="ring-status" id="ringStatus">READY</div>
          <div class="ring-sub" id="ringSub">SET YOUR WINDOW</div>
        </div>
      </div>
    </section>

    <!-- ── Rotary Dial ── -->
    <section class="dial-section">
      <div class="dial-header">
        <span class="dial-meta">FAST</span>
        <div class="dial-display" id="dialDisplay">
          <span class="dial-hours" id="dialFastHours">16</span>
          <span class="dial-colon">:</span>
          <span class="dial-eat" id="dialEatHours">8</span>
        </div>
        <span class="dial-meta">EAT</span>
      </div>

      <div class="dial-wrap">
        <svg id="dialSvg" class="dial-svg" viewBox="0 0 220 148" touch-action="none">
          <!-- Full track arc -->
          <path id="dialTrack" class="d-track"/>
          <!-- Active filled arc -->
          <path id="dialActive" class="d-active"/>
          <!-- Hour tick marks -->
          <g id="dialTicks"></g>
          <!-- Draggable knob -->
          <g id="dialKnob">
            <circle class="knob-shadow" r="16"/>
            <circle class="knob-body" r="14"/>
            <circle class="knob-dot" r="4"/>
            <line class="knob-pointer" x1="0" y1="-6" x2="0" y2="-13"/>
          </g>
          <!-- Large invisible drag surface -->
          <circle id="dragSurface" cx="110" cy="95" r="95" fill="transparent"/>
        </svg>
        <div class="dial-ends">
          <span>12H</span>
          <span>23H</span>
        </div>
      </div>
    </section>

    <!-- ── Big Action Button ── -->
    <section class="cta-section">
      <button class="cta-btn" id="ctaBtn" aria-label="Start or stop fast">
        <span class="cta-label" id="ctaLabel">START FAST</span>
        <span class="cta-sub" id="ctaSub"></span>
      </button>
    </section>

  </div><!-- /.app -->

  <!-- ── Modal ── -->
  <div class="modal" id="historyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">HISTORY & EDIT</h2>
        <button class="modal-close" id="closeHistoryModal">✕</button>
      </div>
      <div class="modal-body">
        
        <div class="modal-section" id="activeFastSection" style="display: none;">
          <h3 class="modal-subtitle">ACTIVE FAST</h3>
          <div class="input-group">
            <label>START TIME</label>
            <input type="datetime-local" id="editStartTime" class="dt-input">
          </div>
          <button class="btn-outline" id="saveStartTimeBtn">SAVE START TIME</button>
        </div>

        <div class="modal-section">
          <h3 class="modal-subtitle">ADD PAST FAST</h3>
          <div class="input-row">
            <div class="input-group">
              <label>START</label>
              <input type="datetime-local" id="addPastStart" class="dt-input">
            </div>
            <div class="input-group">
              <label>END</label>
              <input type="datetime-local" id="addPastEnd" class="dt-input">
            </div>
          </div>
          <button class="btn-outline" id="addPastBtn">ADD ENTRY</button>
        </div>

        <div class="modal-section" style="flex:1; display:flex; flex-direction:column; min-height:0;">
          <h3 class="modal-subtitle">PREVIOUS FASTS</h3>
          <div class="history-list" id="historyList"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
