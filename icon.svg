<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#111110"/>
  <!-- Bauhaus circle accent -->
  <circle cx="380" cy="130" r="110" fill="#1A3B94" opacity="0.6"/>
  <!-- Ring track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#F0EDE4" stroke-width="20" opacity="0.15"/>
  <!-- Ring progress arc (~75%) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1A3B94" stroke-width="20"
    stroke-linecap="round"
    stroke-dasharray="1005"
    stroke-dashoffset="251"
    transform="rotate(-90 256 256)"/>
  <!-- Yellow dot -->
  <circle cx="256" cy="96" r="18" fill="#EDB81E"/>
  <!-- FAST text -->
  <text x="256" y="300" text-anchor="middle"
    font-family="'Bebas Neue', 'Arial Narrow', sans-serif"
    font-size="88" font-weight="700"
    fill="#F0EDE4" letter-spacing="12">FAST</text>
</svg>
